name: Research prototype checks
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # opencv pinned <5: the legacy Haar face-detector path (gui/rppg_core) does not exist
      # in opencv 5 headless builds; unpinned installs silently break it.
      - run: python -m pip install pytest numpy scipy pandas matplotlib 'opencv-python-headless<5'
      - run: python -m pytest -q
      - run: python -m compileall -q gui research tests
      - run: python research/backends/benchmark.py tests/fixtures/rppg_rgb_fixture.csv --backends rsbvp_native --output-dir /tmp/rsbvp_benchmark_smoke
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gui/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: gui/frontend/package-lock.json
      - run: npm ci
      - run: npm run test
      - run: npm run build
      - run: npm run lint
