[pytest]
; Tests live in tests/ only. The pinned research repositories under tools/ are
; git submodules with their own suites that require packages and hardware this
; project does not depend on (triton, mamba, tensorflow, GPU), so they are not
; collected: `python -m pytest -q` stays offline, dataset-free and GPU-free.
testpaths = tests
norecursedirs = tools .git node_modules .venv
